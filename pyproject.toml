[project]
name = "nace-jl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.2.0",
    "icecream>=2.1.5",
    "minigrid>=3.0.0",
    "xminigrid>=0.9.1",
]

[dependency-groups]
dev = [
    "ipython>=9.4.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-shadcn>=0.9.0",
]

[tool.ruff]
lint.select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E",
    "W",
    # isort
    "I001"
]

[tool.ruff.lint.isort]
known-first-party = ["nace"]
